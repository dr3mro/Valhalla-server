name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/valhalla-server-run

jobs:
  build:
    name: Build, test, smoke (${{ matrix.slug }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check configuration
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Set the repository secrets DOCKER_USERNAME and DOCKER_PASSWORD"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Compiles all dependencies and the server inside Alpine and runs the unit tests
      - name: Build image (runs unit tests)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VALHALLA_VERSION=${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.slug }}
          cache-to: type=gha,scope=docker-${{ matrix.slug }},mode=max
          load: true
          tags: valhalla-smoke:test

      - name: Smoke test
        run: |
          wait_healthy() {
            for _ in $(seq 1 60); do
              case "$(docker inspect -f '{{.State.Health.Status}}' smoke)" in
                healthy) return 0 ;;
                unhealthy) break ;;
              esac
              [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || break
              sleep 2
            done
            docker logs smoke
            return 1
          }
          sql() {
            docker exec smoke su-exec postgres psql -qtAX -d valhalla -c "$1"
          }

          docker run -d --name smoke -p 8080:8080 \
            -e DB_NAME=valhalla -e DB_USER=app -e DB_PASS="it's-a-test" \
            valhalla-smoke:test
          wait_healthy
          curl -fsS http://127.0.0.1:8080/api/v2/hello

          sql 'CREATE TABLE smoke_marker ()'
          docker restart smoke
          wait_healthy
          curl -fsS http://127.0.0.1:8080/api/v2/hello
          [ "$(sql "SELECT to_regclass('smoke_marker') IS NULL")" = t ]

          [ "$(docker exec smoke sh -c 'stat -c %U /proc/$(pidof server)')" = valhalla ]

      - name: Push image by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VALHALLA_VERSION=${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.slug }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export binary and digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests" dist
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          docker cp smoke:/app/server dist/server
          tar -czf "dist/server-alpine-$SLUG.tar.gz" -C dist server

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.slug }}
          path: dist/server-alpine-${{ matrix.slug }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Prepare release metadata
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            git log -1 --pretty=%B
            echo
            echo "---"
            echo "Binaries are built on Alpine Linux (musl libc) and run on Alpine-based systems."
            echo "On any other OS, use the Docker image: \`docker run -p 8080:8080 $IMAGE:$TAG\`"
          } > release-notes.md
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          bodyFile: release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          artifacts: dist/*.tar.gz
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true

  publish:
    name: Publish multi-arch image
    needs: [build, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
