name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/valhalla-server-run
  DEPS_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/valhalla-server-deps

jobs:
  build:
    name: Build, test, smoke (${{ matrix.slug }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check configuration
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Set the repository secrets DOCKER_USERNAME and DOCKER_PASSWORD"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Restore ccache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/ccache-${{ matrix.slug }}
          key: ccache-${{ matrix.slug }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.slug }}-

      - name: Inject ccache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "/tmp/ccache-${{ matrix.slug }}": {
                "target": "/root/.ccache",
                "id": "ccache-${{ matrix.slug }}"
              }
            }
          skip-extraction: true

      - name: Build image and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VALHALLA_VERSION=${{ github.ref_name }}
            DEPS_IMAGE=${{ env.DEPS_IMAGE }}:${{ matrix.slug }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=src-${{ matrix.slug }}
          cache-to: type=gha,scope=src-${{ matrix.slug }},mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Extract ccache from BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "/tmp/ccache-${{ matrix.slug }}": {
                "target": "/root/.ccache",
                "id": "ccache-${{ matrix.slug }}"
              }
            }
          skip-injection: true

      - name: Pull image for smoke test
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" valhalla-smoke:test

      - name: Smoke test
        run: |
          wait_healthy() {
            for _ in $(seq 1 60); do
              case "$(docker inspect -f '{{.State.Health.Status}}' smoke)" in
                healthy) return 0 ;;
                unhealthy) break ;;
              esac
              [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || break
              sleep 2
            done
            docker logs smoke
            return 1
          }
          sql() {
            docker exec smoke su-exec postgres psql -qtAX -d valhalla -c "$1"
          }

          docker run -d --name smoke -p 8080:8080 \
            -e DB_NAME=valhalla -e DB_USER=app -e DB_PASS="it's-a-test" \
            valhalla-smoke:test
          wait_healthy
          curl -fsS http://127.0.0.1:8080/api/v2/hello

          sql 'CREATE TABLE smoke_marker ()'
          docker restart smoke
          wait_healthy
          curl -fsS http://127.0.0.1:8080/api/v2/hello
          [ "$(sql "SELECT to_regclass('smoke_marker') IS NULL")" = t ]

          [ "$(docker exec smoke sh -c 'stat -c %U /proc/$(pidof server)')" = valhalla ]

      - name: Export binary and digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests" dist
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          docker cp smoke:/app/server dist/server
          tar -czf "dist/server-alpine-$SLUG.tar.gz" -C dist server

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.slug }}
          path: dist/server-alpine-${{ matrix.slug }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Prepare release metadata
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            git log -1 --pretty=%B
            echo
            echo "---"
            echo "Binaries are built on Alpine Linux (musl libc) and run on Alpine-based systems."
            echo "On any other OS, use the Docker image: \`docker run -p 8080:8080 $IMAGE:$TAG\`"
          } > release-notes.md
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          bodyFile: release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          artifacts: dist/*.tar.gz
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true

  publish:
    name: Publish multi-arch image
    needs: [build, release]
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
