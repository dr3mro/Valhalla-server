name: Scripts

# Tests every shell script on Linux and macOS: lint, the offline suite
# (.github/scripts/test_tool.sh: installer, vdt commands, dry runs, helper
# scripts) and, on Linux, the vdt container commands end to end with Docker.
# GitHub's macOS runners have no container runtime, so macOS gets the offline
# suite only (with both Homebrew bash and the system bash 3.2).

on:
  push:
    branches:
      - main
    paths:
      - "**/*.sh"
      - api_tests/payloads/**
      - .github/scripts/**
      - .github/workflows/scripts.yml
  pull_request:
    paths:
      - "**/*.sh"
      - api_tests/payloads/**
      - .github/scripts/**
      - .github/workflows/scripts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: true

env:
  VALHALLA_NO_COMPLETION: "1"
  VALHALLA_NO_UPDATE_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck and dash
        run: |
          sudo apt-get install -y -qq dash >/dev/null
          # Every tracked script, as the shell its shebang names.
          status=0
          for f in $(git ls-files '*.sh'); do
            case "$(head -n 1 "$f")" in
              *bash*) shellcheck -s bash "$f" || status=1 ;;
              *) shellcheck -s sh "$f" && dash -n "$f" || status=1 ;;
            esac
          done
          exit "$status"

  offline:
    name: Offline (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, bash 5
            os: ubuntu-24.04
            bash: bash
          - name: macOS, Homebrew bash
            os: macos-15
            bash: bash
          - name: macOS, system bash 3.2
            os: macos-15
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq dash zsh fzf jq >/dev/null
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install bash fzf jq >/dev/null
          fi
          ${{ matrix.bash }} --version | head -n 1

      - name: Run the offline suite
        env:
          TOOL_BASH: ${{ matrix.bash }}
        run: bash .github/scripts/test_tool.sh

  docker:
    name: Docker end to end (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: vdt commands with the published image
        run: |
          set -eux
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          V="./valhalla.sh --runtime docker --name ci --port 18080"   # split on purpose
          sql() { echo "$1" | $V psql | sed -n 3p | tr -d ' '; }

          # Dry runs change nothing
          $V run
          for c in stop restart delete clean dump shell; do $V "$c" -n; done
          $V status | grep -q 'State:     running'

          # Inspect
          $V status | grep -q 'Health:    answering'
          $V logs 20 | grep -q .
          rc=0; timeout 5 ./valhalla.sh --runtime docker --name ci show >"$RUNNER_TEMP/show.log" 2>&1 || rc=$?
          [ "$rc" = 124 ] && test -s "$RUNNER_TEMP/show.log"
          rc=0; timeout 5 ./valhalla.sh --runtime docker --name ci stats >"$RUNNER_TEMP/stats.log" 2>&1 || rc=$?
          [ "$rc" = 124 ] && grep -q ci "$RUNNER_TEMP/stats.log"
          $V env | grep -q '^TOKEN_SECRET=<hidden>$'
          $V outdated | grep -qE 'Up to date|Update available'
          [ "$(echo 'id -un' | $V shell)" = root ]

          # doc opens the docs URL (xdg-open stubbed)
          mkdir -p "$RUNNER_TEMP/bin"
          printf "#!/bin/sh\necho \"\$1\" >'%s/opened'\n" "$RUNNER_TEMP" >"$RUNNER_TEMP/bin/xdg-open"
          chmod +x "$RUNNER_TEMP/bin/xdg-open"
          PATH="$RUNNER_TEMP/bin:$PATH" $V doc
          grep -q 'http://127.0.0.1:18080/api/v2/doc' "$RUNNER_TEMP/opened"

          # dump and restore
          echo "create table ci_dump(x int); insert into ci_dump values (7);" | $V psql
          $V dump "$RUNNER_TEMP/ci.sql"
          test -s "$RUNNER_TEMP/ci.sql"
          echo "drop table ci_dump;" | $V psql
          if $V restore "$RUNNER_TEMP/ci.sql" </dev/null; then exit 1; fi # asks first
          $V restore --yes "$RUNNER_TEMP/ci.sql"
          test "$(sql 'select x from ci_dump;')" = 7

          # stop, restart, run
          $V stop
          $V status | grep -q 'State:     exited'
          $V logs 5 | grep -q .                                  # logs work while stopped
          if $V psql </dev/null; then exit 1; fi                 # psql needs it running
          $V run
          $V restart
          $V status | grep -q 'Health:    answering'

          # Persistence survives stop/run and update
          $V update --persist
          echo "create table ci_marker(x int); insert into ci_marker values (1),(2);" | $V psql
          $V stop && $V run
          test "$(sql 'select count(*) from ci_marker;')" = 2
          $V update
          test "$(sql 'select count(*) from ci_marker;')" = 2
          $V update --no-persist
          test "$(sql "select to_regclass('ci_marker') is null;")" = t

          # delete asks first; clean removes the container and the images
          if $V delete </dev/null; then exit 1; fi
          $V delete --yes
          $V status | grep -q 'State:     not created'
          $V run
          $V clean --yes
          $V status | grep -q 'State:     not created'
          test -z "$(docker image ls -q 'dr3mro/valhalla-server-run')"

      - name: New entrypoint (persistence inside the image)
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/ep" "$RUNNER_TEMP/persist"
          cp docker/entrypoint.sh "$RUNNER_TEMP/ep/"
          printf 'FROM docker.io/%s/valhalla-server-run:latest\nCOPY --chmod=755 entrypoint.sh /entrypoint.sh\n' \
            "${{ github.repository_owner }}" >"$RUNNER_TEMP/ep/Dockerfile"
          docker build -t ep-test "$RUNNER_TEMP/ep"

          wait_up() { for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18081/api/v2/hello >/dev/null && return 0; sleep 2; done; docker logs ep; return 1; }
          sql() { docker exec ep su-exec postgres psql -qtAX -d postgres -c "$1"; }

          # Without persistence: init.sql, wiped on restart, server runs as valhalla
          docker run -d --name ep -p 18081:8080 ep-test
          wait_up
          sql 'create table m(x int)'
          docker restart ep && wait_up
          [ "$(sql "select to_regclass('m') is null")" = t ]
          [ "$(docker exec ep sh -c 'stat -c %U /proc/$(pidof server)')" = valhalla ]
          docker rm -f ep

          # With persistence: saved on stop (also docker restart), loaded on start
          docker run -d --name ep -p 18081:8080 -e VALHALLA_PERSIST=1 \
            -e VALHALLA_PERSIST_FILE=/persist/ep.sql -v "$RUNNER_TEMP/persist:/persist" ep-test
          wait_up
          sql 'create table m(x int); insert into m values (1),(2),(3)'
          docker restart -t 30 ep && wait_up
          test -s "$RUNNER_TEMP/persist/ep.sql"
          [ "$(sql 'select count(*) from m')" = 3 ]

          # SIGHUP restarts only the server; the data stays
          old="$(docker exec ep pidof server)"
          docker exec ep kill -HUP 1
          sleep 3 && wait_up
          [ "$(docker exec ep pidof server)" != "$old" ]
          [ "$(sql 'select count(*) from m')" = 3 ]
          docker rm -f ep
