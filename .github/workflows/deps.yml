name: Build deps image

# Reusable: called by ccache-warm.yml and release.yml. The image is tagged
# with a hash of conanfile.txt, conan.lock and Dockerfile.deps, so it is
# built only when no image for those exact inputs exists yet, on any ref.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# github.workflow is the caller's name when called, so a manual run and a
# called run never cancel each other; queue instead so callers don't fail.
concurrency:
  group: deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPS_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/valhalla-server-deps

jobs:
  build-deps:
    name: Deps image (${{ matrix.slug }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check configuration
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Set the repository secrets DOCKER_USERNAME and DOCKER_PASSWORD"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute deps tag
        id: dt
        run: |
          h=$(cat conanfile.txt conan.lock docker/Dockerfile.deps | sha256sum | cut -c1-12)
          echo "tag=${h}-${{ matrix.slug }}" >> "$GITHUB_OUTPUT"

      - name: Check whether this deps image already exists
        id: exists
        run: |
          if docker buildx imagetools inspect "$DEPS_IMAGE:${{ steps.dt.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push deps image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.deps
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DEPS_IMAGE }}:${{ steps.dt.outputs.tag }}
          cache-from: type=gha,scope=deps-${{ matrix.slug }}
          cache-to: type=gha,scope=deps-${{ matrix.slug }},mode=max

      # :<arch> stays as a convenience pointer to what main last used.
      - name: Point :${{ matrix.slug }} at it (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create -t "$DEPS_IMAGE:${{ matrix.slug }}" \
            "$DEPS_IMAGE:${{ steps.dt.outputs.tag }}"
