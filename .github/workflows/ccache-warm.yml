name: Warm ccache

# actions/cache entries are scoped per ref: a tag run can only restore caches
# from its own tag or from the default branch. Release runs only on tags, so
# without this workflow every new tag starts with an empty ccache. Building
# the compile stage on main saves a ccache and a Docker layer cache (scope
# src-<arch>) that every later tag can restore. For a tag on a commit this
# workflow already built, the release reuses the compile+test layer as is.

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - libs/**
      - tests/**
      - cmake/**
      - CMakeLists.txt
      - scripts/build/get_tag.sh
      - conanfile.txt
      - conan.lock
      - docker/Dockerfile.deps
      - docs/api.html
      - tools/cmake/**
      - tools/conan/**
      - cmake/**
      - docker/Dockerfile
      - .github/workflows/ccache-warm.yml
      - .github/actions/ccache-buildkit/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccache-warm-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPS_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/valhalla-server-deps

jobs:
  # No-op when an image for the current Conan inputs already exists.
  deps:
    name: Deps image
    uses: ./.github/workflows/deps.yml
    secrets: inherit

  warm:
    name: Build and test (${{ matrix.slug }})
    needs: deps
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute deps tag
        id: dt
        run: |
          h=$(cat conanfile.txt conan.lock docker/Dockerfile.deps | sha256sum | cut -c1-12)
          echo "tag=${h}-${{ matrix.slug }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Restore ccache and inject into BuildKit
        uses: ./.github/actions/ccache-buildkit
        with:
          phase: inject
          arch: ${{ matrix.slug }}

      # Compile stage only: compiles and runs unit tests, produces no image.
      # Its layers go to the GHA cache under main, where release.yml reads them.
      - name: Build compile stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: compile
          platforms: ${{ matrix.platform }}
          build-args: |
            DEPS_IMAGE=${{ env.DEPS_IMAGE }}:${{ steps.dt.outputs.tag }}
          cache-from: type=gha,scope=src-${{ matrix.slug }}
          cache-to: type=gha,scope=src-${{ matrix.slug }},mode=max
          outputs: type=cacheonly

      - name: Extract ccache from BuildKit and save
        uses: ./.github/actions/ccache-buildkit
        with:
          phase: extract
          arch: ${{ matrix.slug }}
          save: "true"
