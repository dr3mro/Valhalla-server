name: Warm ccache

# actions/cache entries are scoped per ref: a tag run can only restore caches
# from its own tag or from the default branch. Release runs only on tags, so
# without this workflow every new tag starts with an empty ccache. Building
# the compile stage on main saves a ccache and a Docker layer cache (scope
# src-<arch>) that every later tag can restore. For a tag on a commit this
# workflow already built, the release reuses the compile+test layer as is.

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - CMakeLists.txt
      - get_tag.sh
      - conanfile.txt
      - conan.lock
      - docker/Dockerfile.deps
      - docs/api.html
      - tools/cmake/**
      - tools/conan/**
      - docker/Dockerfile
      - .github/workflows/ccache-warm.yml
      - .github/actions/ccache-buildkit/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccache-warm-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPS_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/valhalla-server-deps

jobs:
  # Rebuild the deps image only when its inputs changed in this push.
  # Manual runs and pushes whose base commit is unknown always rebuild.
  changes:
    name: Detect Conan changes
    runs-on: ubuntu-24.04
    outputs:
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Diff deps inputs
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "deps=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- conanfile.txt conan.lock docker/Dockerfile.deps; then
            echo "deps=false" >> "$GITHUB_OUTPUT"
          else
            echo "deps=true" >> "$GITHUB_OUTPUT"
          fi

  deps:
    name: Deps image
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    uses: ./.github/workflows/deps.yml
    secrets: inherit

  warm:
    name: Build and test (${{ matrix.slug }})
    needs: [changes, deps]
    # Run after deps succeeds, or straight away when deps was skipped.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.deps.result == 'success' || needs.deps.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Restore ccache and inject into BuildKit
        uses: ./.github/actions/ccache-buildkit
        with:
          phase: inject
          arch: ${{ matrix.slug }}

      # Compile stage only: compiles and runs unit tests, produces no image.
      # Its layers go to the GHA cache under main, where release.yml reads them.
      - name: Build compile stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: compile
          platforms: ${{ matrix.platform }}
          build-args: |
            DEPS_IMAGE=${{ env.DEPS_IMAGE }}:${{ matrix.slug }}
          cache-from: type=gha,scope=src-${{ matrix.slug }}
          cache-to: type=gha,scope=src-${{ matrix.slug }},mode=max
          outputs: type=cacheonly

      - name: Extract ccache from BuildKit and save
        uses: ./.github/actions/ccache-buildkit
        with:
          phase: extract
          arch: ${{ matrix.slug }}
          save: "true"
